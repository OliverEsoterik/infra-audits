# Credentials Template
# WARNING: This file contains sensitive information. DO NOT commit.
# Use environment variable substitution where possible: ${VAR_NAME}

credentials:
  # Azure / Entra ID
  azure:
    method: service_principal
    config:
      tenant_id: "${AZURE_TENANT_ID}"
      client_id: "${AZURE_CLIENT_ID}"
      client_secret: "${AZURE_CLIENT_SECRET}"
      environment: public  # public, gov, china

  # Active Directory
  active-directory:
    method: service_account
    config:
      domain: "corp.acme.com"
      username: "svc-audit@corp.acme.com"
      password: "${AD_SVC_PASSWORD}"
      auth_type: kerberos

  # Kubernetes
  kubernetes:
    method: kubeconfig
    config:
      # Path to kubeconfig file (relative to repo root or absolute)
      path: "clients/acme-corp/kubeconfig.yaml"
      context: "prod-cluster-1"

  # Windows Server (via WinRM)
  windows-server:
    method: winrm
    config:
      hosts:
        - "dc-01.corp.acme.com"
        - "sql-01.corp.acme.com"
      username: "svc-audit"
      password: "${WIN_SVC_PASSWORD}"
      auth: kerberos  # kerberos, credssp, ntlm, basic
      ssl_verify: true

  # Linux / ESXi (via SSH)
  linux:
    method: ssh
    config:
      username: "svc-audit"
      key_file: "~/.ssh/audit_key"
      port: 22

  # VMware vCenter
  vmware-vcenter:
    method: service_account
    config:
      host: "vcenter.corp.acme.com"
      username: "svc-audit@vsphere.local"
      password: "${VCENTER_PASSWORD}"
      ssl_verify: true

  # Oracle Database
  oracle:
    method: wallet
    config:
      tns_admin: "/path/to/wallet"
      username: "svc_audit"
      password: "${ORACLE_PASSWORD}"
      role: "standard"  # standard, sysdba